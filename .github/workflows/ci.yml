name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f api/Dockerfile -t delivery-eta:ci .
      - name: Smoke test
        run: |
          docker run -d --name eta -p 8080:8080 delivery-eta:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/health
          curl -sf -H 'Content-Type: application/json' \
            -d '{"distance_km":2.5,"pending_orders":3}' localhost:8080/eta
